    <script>
      (function() {
        function updateAdaptiveLogo() {
          try {
            var ua = navigator.userAgent || '';
            var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua) || (window.innerWidth && window.innerWidth <= 768);
            var favicon = document.getElementById('app-favicon');
            var appleIcon = document.getElementById('app-apple-icon');
            if (isMobile) {
              // Móvil: Logo oficial Spotify redondeado
              if (favicon) {
                favicon.type = 'image/png';
                favicon.href = '/icon-192.png';
              }
              if (appleIcon) {
                appleIcon.href = '/apple-touch-icon.png';
              }
            } else {
              // Ordenador: SOLO EL LOGO (vector circular verde transparente)
              if (favicon) {
                favicon.type = 'image/svg+xml';
                favicon.href = '/favicon.svg';
              }
              if (appleIcon) {
                appleIcon.href = '/icon-desktop-192.png';
              }
            }
            // Icono de la app elegido en Ajustes (se aplica antes de "Añadir a pantalla de inicio")
            var chosen = null;
            try { chosen = window.localStorage.getItem('spotifree_app_icon'); } catch (e2) {}
            var manifest = document.getElementById('app-manifest');
            if (chosen && chosen !== 'default' && /^[a-z0-9-]+$/.test(chosen)) {
              var base = '/app-icons/variants/' + chosen;
              if (favicon) { favicon.type = 'image/png'; favicon.href = base + '/icon-192.png'; }
              if (appleIcon) { appleIcon.href = base + '/apple-touch-icon.png'; }
              if (manifest) { manifest.href = base + '/manifest.webmanifest'; }
            } else if (manifest) {
              manifest.href = '/manifest.webmanifest';
            }
          } catch (e) {}
        }
        updateAdaptiveLogo();
        window.addEventListener('resize', updateAdaptiveLogo);
      })();
    </script>
    <!-- APK launch animation: the official logo with a soft pulse, shown at once (no JS needed) and faded out by main.tsx when the app is ready -->
    <style>
      #sf-splash{display:none}
      html.sf-native #sf-splash{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#121212;transition:opacity .45s ease,visibility .45s ease}
      html.sf-native #sf-splash.sf-hide{opacity:0;visibility:hidden}
      #sf-splash .sf-logo{position:relative;width:104px;height:104px}
      #sf-splash .sf-logo img{position:relative;width:100%;height:100%;border-radius:50%;animation:sf-pop .7s cubic-bezier(.2,.9,.3,1.2) both,sf-breathe 1.8s ease-in-out .7s infinite}
      #sf-splash .sf-logo::before,#sf-splash .sf-logo::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #1ed760;opacity:0;animation:sf-ring 1.8s ease-out .5s infinite}
      #sf-splash .sf-logo::after{animation-delay:1.1s}
      #sf-splash .sf-bars{display:flex;align-items:flex-end;gap:5px;height:22px}
      #sf-splash .sf-bars i{display:block;width:4px;height:100%;border-radius:2px;background:#1ed760;transform-origin:bottom;animation:sf-bar 1s ease-in-out infinite}
      #sf-splash .sf-bars i:nth-child(2){animation-delay:.15s}#sf-splash .sf-bars i:nth-child(3){animation-delay:.3s}#sf-splash .sf-bars i:nth-child(4){animation-delay:.45s}
      @keyframes sf-pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
      @keyframes sf-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      @keyframes sf-ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
      @keyframes sf-bar{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
      @media (prefers-reduced-motion:reduce){#sf-splash *{animation:none!important}}
    </style>
    <script>
      (function () {
        try {
          var cap = window.Capacitor;
          if (cap && cap.isNativePlatform && cap.isNativePlatform()) document.documentElement.classList.add('sf-native');
        } catch (e) {}
        window.__sfSplashStart = Date.now();
        // Never leave it up: if the app does not call it, it goes away after 8 s
        window.__sfHideSplash = function () {
          var s = document.getElementById('sf-splash');
          if (!s || s.classList.contains('sf-hide')) return;
          s.classList.add('sf-hide');
          setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 600);
        };
        setTimeout(function () { window.__sfHideSplash(); }, 8000);
      })();
