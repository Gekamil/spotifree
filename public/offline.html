<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#121212" />
<title>Spotifree sin conexión</title>
<style>
  :root {
    --bg: #121212;
    --card: #181818;
    --card-hover: #282828;
    --text: #ffffff;
    --sub: #b3b3b3;
    --green: #1ed760;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 680px;
    margin: 0 auto;
    position: relative;
  }
  header {
    padding: 24px 20px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand img {
    width: 36px;
    height: 36px;
    border-radius: 8px;
  }
  .brand h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 700;
  }
  .badge {
    font-size: 11px;
    background: rgba(30, 215, 96, 0.15);
    color: var(--green);
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
    border: 1px solid rgba(30, 215, 96, 0.3);
  }
  .track-list {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 140px;
  }
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;
    color: var(--sub);
  }
  .empty-state svg {
    margin-bottom: 16px;
    color: rgba(255, 255, 255, 0.3);
  }
  .empty-state h2 {
    color: var(--text);
    font-size: 20px;
    margin: 0 0 8px;
  }
  .track-item {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    margin-bottom: 4px;
  }
  .track-item:hover, .track-item:active {
    background: var(--card-hover);
  }
  .track-item.playing {
    background: rgba(30, 215, 96, 0.1);
  }
  .track-item.playing .track-title {
    color: var(--green);
  }
  .track-cover {
    width: 48px;
    height: 48px;
    border-radius: 6px;
    object-fit: cover;
    margin-right: 14px;
    background: #242424;
    flex-shrink: 0;
  }
  .track-info {
    flex: 1;
    min-width: 0;
  }
  .track-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-artist {
    font-size: 13px;
    color: var(--sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .player-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 680px;
    margin: 0 auto;
    background: #181818;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding: 12px 20px 24px;
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.6);
    display: none;
  }
  .player-bar.active {
    display: block;
  }
  .player-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .player-track {
    display: flex;
    align-items: center;
    min-width: 0;
    flex: 1;
  }
  .player-track img {
    width: 42px;
    height: 42px;
    border-radius: 4px;
    margin-right: 12px;
    background: #282828;
  }
  .player-controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .play-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #fff;
    color: #000;
    border: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .play-btn:active {
    transform: scale(0.95);
  }
  .progress-bar-container {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--sub);
  }
  .progress-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
    outline: none;
  }
  .progress-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }
  .retry-btn {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px;
    background: transparent;
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 18px;
    cursor: pointer;
    margin-top: 16px;
    transition: background 0.2s;
  }
  .retry-btn:hover {
    background: rgba(255, 255, 255, 0.1);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <img src="icon-192.png" alt="Logo" onerror="this.style.display='none'" />
      <div>
        <h1>Música descargada</h1>
        <div style="font-size: 12px; color: var(--sub);">Modo avión • Sin conexión</div>
      </div>
    </div>
    <div class="badge" id="track-count">0 canciones</div>
  </header>

  <div class="track-list" id="track-list">
    <div class="empty-state" id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
      </svg>
      <h2>No hay canciones descargadas</h2>
      <p>Cuando tengas conexión, pulsa el botón de descargar en tus playlists o canciones favoritas para escucharlas sin conexión.</p>
      <button class="retry-btn" onclick="tryLaunchFullApp()">Abrir Spotifree completo</button>
    </div>
  </div>

  <div class="player-bar" id="player-bar">
    <div class="player-top">
      <div class="player-track">
        <img id="p-cover" src="" alt="" />
        <div style="min-width: 0; flex: 1;">
          <div id="p-title" class="track-title">-</div>
          <div id="p-artist" class="track-artist">-</div>
        </div>
      </div>
      <div class="player-controls">
        <button class="play-btn" id="p-play-btn" onclick="togglePlay()">
          <svg id="p-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="progress-bar-container">
      <span id="p-cur-time">0:00</span>
      <input type="range" class="progress-slider" id="p-progress" min="0" max="100" value="0" oninput="seekTrack(this.value)" />
      <span id="p-dur-time">0:00</span>
    </div>
  </div>
</div>

<audio id="audio-el" preload="auto"></audio>

<script>
  // 1. If local bundled app exists, immediately attempt transparent redirect
  function tryLaunchFullApp() {
    location.replace('index.html');
  }

  // 2. Standalone offline fallback player for downloaded tracks in musica-spotifree cache
  const CACHE_NAME = 'musica-spotifree';
  const TRACK_META_PREFIX = 'spotifree_offline_track_';
  let downloadedTracks = [];
  let currentTrack = null;
  const audio = document.getElementById('audio-el');

  function formatTime(sec) {
    if (isNaN(sec) || sec <= 0) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  async function loadDownloadedTracks() {
    const list = [];
    const ids = new Set();

    // From localStorage metadata
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(TRACK_META_PREFIX)) {
        try {
          const raw = localStorage.getItem(key);
          if (raw) {
            const track = JSON.parse(raw);
            if (track && track.id) {
              list.push(track);
              ids.add(track.id);
            }
          }
        } catch {}
      }
    }

    // Verify cache existence
    if ('caches' in window) {
      try {
        const cache = await caches.open(CACHE_NAME);
        const keys = await cache.keys();
        for (const req of keys) {
          const m = req.url.match(/\/musica-spotifree\/tracks\/([^/]+)\.mp3$/);
          if (m && m[1] && !ids.has(m[1])) {
            list.push({ id: m[1], name: 'Canción descargada (' + m[1] + ')', artists: [{ name: 'Desconocido' }] });
          }
        }
      } catch {}
    }

    downloadedTracks = list;
    renderList();
  }

  function renderList() {
    const container = document.getElementById('track-list');
    const empty = document.getElementById('empty-state');
    const badge = document.getElementById('track-count');

    badge.innerText = downloadedTracks.length + ' canciones';

    if (downloadedTracks.length === 0) {
      empty.style.display = 'flex';
      return;
    }
    empty.style.display = 'none';

    container.innerHTML = '';
    downloadedTracks.forEach((t) => {
      const div = document.createElement('div');
      div.className = 'track-item' + (currentTrack && currentTrack.id === t.id ? ' playing' : '');
      const cover = t.album?.images?.[0]?.url || 'icon-192.png';
      const artist = t.artists?.[0]?.name || 'Artista';

      div.innerHTML = `
        <img class="track-cover" src="${cover}" onerror="this.src='icon-192.png'" />
        <div class="track-info">
          <div class="track-title">${t.name}</div>
          <div class="track-artist">${artist}</div>
        </div>
      `;
      div.onclick = () => playTrack(t);
      container.appendChild(div);
    });
  }

  async function playTrack(track) {
    currentTrack = track;
    const cleanId = (track.id || '').replace(/^spotify:track:/i, '');
    let blobUrl = null;

    if ('caches' in window) {
      try {
        const cache = await caches.open(CACHE_NAME);
        const res = (await cache.match('/musica-spotifree/tracks/' + cleanId + '.mp3')) ||
                    (await cache.match('/musica-spotifree/tracks/' + track.id + '.mp3'));
        if (res) {
          const blob = await res.blob();
          blobUrl = URL.createObjectURL(blob);
        }
      } catch (e) {
        console.warn('Cache lookup failed:', e);
      }
    }

    if (!blobUrl) {
      alert('El archivo de audio descargado no está disponible en este dispositivo.');
      return;
    }

    audio.src = blobUrl;
    audio.play();

    document.getElementById('player-bar').classList.add('active');
    document.getElementById('p-title').innerText = track.name;
    document.getElementById('p-artist').innerText = track.artists?.[0]?.name || 'Artista';
    document.getElementById('p-cover').src = track.album?.images?.[0]?.url || 'icon-192.png';

    renderList();
  }

  function togglePlay() {
    if (audio.paused) {
      audio.play();
    } else {
      audio.pause();
    }
  }

  audio.onplay = () => {
    document.getElementById('p-play-icon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  };

  audio.onpause = () => {
    document.getElementById('p-play-icon').innerHTML = '<path d="M8 5v14l11-7z"/>';
  };

  audio.ontimeupdate = () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('p-progress').value = pct;
    document.getElementById('p-cur-time').innerText = formatTime(audio.currentTime);
    document.getElementById('p-dur-time').innerText = formatTime(audio.duration);
  };

  function seekTrack(pct) {
    if (audio.duration) {
      audio.currentTime = (pct / 100) * audio.duration;
    }
  }

  loadDownloadedTracks();
</script>
</body>
</html>
