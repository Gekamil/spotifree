<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#121212" />
<title>Spotifree sin conexión</title>
<style>
  :root {
    --bg: #121212;
    --elevated: #1e1e1e;
    --card: #181818;
    --card-hover: #282828;
    --text: #ffffff;
    --sub: #b3b3b3;
    --green: #1ed760;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 680px;
    margin: 0 auto;
    position: relative;
  }
  header {
    padding: calc(env(safe-area-inset-top, 12px) + 14px) 20px 14px;
    background: linear-gradient(180deg, rgba(30,215,96,0.14) 0%, rgba(18,18,18,0) 100%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, #1e3264, #1ed760);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #fff;
  }
  .brand h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .sub-status {
    font-size: 12px;
    color: var(--sub);
    margin-top: 2px;
  }
  .badge {
    font-size: 11px;
    background: rgba(30, 215, 96, 0.16);
    color: var(--green);
    padding: 5px 10px;
    border-radius: 999px;
    font-weight: 700;
    border: 1px solid rgba(30, 215, 96, 0.35);
    white-space: nowrap;
  }
  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 0 2px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    background: #282828;
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }
  .chip.active {
    background: var(--green);
    color: #000;
  }
  .actions-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px 4px;
    gap: 10px;
  }
  .play-all-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--green);
    color: #000;
    border: 0;
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }
  .play-all-btn:active { transform: scale(0.96); }
  .retry-link {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .track-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 14px 150px;
  }
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
    color: var(--sub);
  }
  .empty-state svg {
    margin-bottom: 14px;
    color: rgba(255, 255, 255, 0.35);
  }
  .empty-state h2 {
    color: var(--text);
    font-size: 19px;
    margin: 0 0 8px;
  }
  .empty-state p {
    font-size: 13px;
    line-height: 1.5;
    max-width: 300px;
  }
  .track-item {
    display: flex;
    align-items: center;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 2px;
  }
  .track-item:hover, .track-item:active {
    background: var(--card-hover);
  }
  .track-item.playing {
    background: rgba(30, 215, 96, 0.12);
  }
  .track-item.playing .track-title {
    color: var(--green);
  }
  .track-cover {
    width: 46px;
    height: 46px;
    border-radius: 6px;
    object-fit: cover;
    margin-right: 12px;
    background: #242424;
    flex-shrink: 0;
  }
  .track-info {
    flex: 1;
    min-width: 0;
  }
  .track-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-artist {
    font-size: 12px;
    color: var(--sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .player-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 680px;
    margin: 0 auto;
    background: #181818;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding: 12px 18px calc(env(safe-area-inset-bottom, 12px) + 12px);
    box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.7);
    display: none;
  }
  .player-bar.active { display: block; }
  .player-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  .player-track {
    display: flex;
    align-items: center;
    min-width: 0;
    flex: 1;
  }
  .player-track img {
    width: 44px;
    height: 44px;
    border-radius: 6px;
    margin-right: 11px;
    background: #282828;
    object-fit: cover;
    flex-shrink: 0;
  }
  .player-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .ctrl-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: transparent;
    color: #fff;
    border: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .play-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #fff;
    color: #000;
    border: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .play-btn:active, .ctrl-btn:active { transform: scale(0.92); }
  .progress-bar-container {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--sub);
    font-variant-numeric: tabular-nums;
  }
  .progress-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: rgba(255, 255, 255, 0.22);
    border-radius: 2px;
    outline: none;
  }
  .progress-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #1ed760;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-row">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
          </svg>
        </div>
        <div style="min-width:0">
          <h1>Modo sin conexión</h1>
          <div class="sub-status">Spotifree • Tus descargas offline</div>
        </div>
      </div>
      <div class="badge" id="track-count">0 canciones</div>
    </div>
    <div class="chips" id="filter-chips"></div>
  </header>

  <div class="actions-row" id="actions-row" style="display:none">
    <button class="play-all-btn" onclick="playAll(false)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Reproducir todo
    </button>
    <button class="retry-link" onclick="tryReconnect()">Volver a intentar conexión</button>
  </div>

  <div class="track-list" id="track-list">
    <div class="empty-state" id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
      </svg>
      <h2>No hay canciones descargadas</h2>
      <p>Cuando tengas conexión, pulsa el icono de descargar en cualquier canción o playlist para escucharla completa en modo avión.</p>
      <button class="retry-link" style="margin-top:16px" onclick="tryReconnect()">Comprobar conexión</button>
    </div>
  </div>

  <div class="player-bar" id="player-bar">
    <div class="player-top">
      <div class="player-track">
        <img id="p-cover" src="icon-192.png" alt="" />
        <div style="min-width: 0; flex: 1;">
          <div id="p-title" class="track-title">-</div>
          <div id="p-artist" class="track-artist">-</div>
        </div>
      </div>
      <div class="player-controls">
        <button class="ctrl-btn" onclick="playPrev()" title="Anterior">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="play-btn" id="p-play-btn" onclick="togglePlay()">
          <svg id="p-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" onclick="playNext()" title="Siguiente">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
    <div class="progress-bar-container">
      <span id="p-cur-time">0:00</span>
      <input type="range" class="progress-slider" id="p-progress" min="0" max="100" value="0" oninput="seekTrack(this.value)" />
      <span id="p-dur-time">0:00</span>
    </div>
  </div>
</div>

<audio id="audio-el" preload="auto"></audio>

<script>
  const CACHE_NAME = 'musica-spotifree';
  const TRACK_META_PREFIX = 'spotifree_offline_track_';
  const IDB_NAME = 'spotifree-offline-db';

  let allTracks = [];
  let offlinePlaylists = [];
  let activeFilter = 'all';
  let currentTrack = null;
  let activeBlobUrl = null;
  const audio = document.getElementById('audio-el');

  function cleanId(id) {
    return String(id || '').replace(/^spotify:track:/i, '').split('?')[0].trim();
  }

  function tryReconnect() {
    if (navigator.onLine) {
      location.replace('https://spotifreeweb.vercel.app/');
    } else {
      location.reload();
    }
  }

  function formatTime(sec) {
    if (!isFinite(sec) || sec <= 0) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function openIDB() {
    return new Promise((resolve) => {
      if (!('indexedDB' in window)) return resolve(null);
      try {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('tracks')) db.createObjectStore('tracks', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('playlists')) db.createObjectStore('playlists', { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      } catch {
        resolve(null);
      }
    });
  }

  async function idbGetAllTracks() {
    const db = await openIDB();
    if (!db) return [];
    return new Promise((resolve) => {
      try {
        const tx = db.transaction('tracks', 'readonly');
        const req = tx.objectStore('tracks').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      } catch {
        resolve([]);
      }
    });
  }

  async function idbGetTrackBlob(id) {
    const db = await openIDB();
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction('tracks', 'readonly');
        const req = tx.objectStore('tracks').get(id);
        req.onsuccess = () => resolve(req.result?.blob || null);
        req.onerror = () => resolve(null);
      } catch {
        resolve(null);
      }
    });
  }

  async function loadOfflineMusic() {
    const byId = new Map();

    // 1. Native Android APK files (works even when WebView falls back to offline.html origin)
    const cap = window.Capacitor;
    const localPlugin = cap?.Plugins?.SpotifreeLocalMusic;
    if (localPlugin) {
      try {
        if (localPlugin.listOfflineData) {
          const nativeOffline = await localPlugin.listOfflineData();
          for (const t of (nativeOffline?.tracks || [])) {
            if (!t || !t.id) continue;
            const c = cleanId(t.id);
            byId.set(c, {
              ...t,
              id: c,
              _offlineUrl: t._nativePath ? cap.convertFileSrc('file://' + t._nativePath) : null,
            });
          }
          offlinePlaylists = Array.isArray(nativeOffline?.playlists) ? nativeOffline.playlists : [];
        }
      } catch {}

      try {
        if (localPlugin.scan) {
          const dev = await localPlugin.scan({ request: false });
          if (dev?.granted && Array.isArray(dev.tracks)) {
            for (const s of dev.tracks) {
              if (!s?.path) continue;
              const id = 'local-dev-' + s.id;
              byId.set(id, {
                id,
                name: s.title || s.path.split('/').pop() || 'Canción local',
                artists: [{ name: s.artist || 'Archivo local' }],
                album: { name: s.album || 'Dispositivo', images: [] },
                _offlineUrl: cap.convertFileSrc('file://' + s.path),
                _isDevice: true,
              });
            }
          }
        }
      } catch {}
    }

    // 2. IndexedDB tracks
    const idbRows = await idbGetAllTracks();
    for (const row of idbRows) {
      if (row?.id && row?.blob && row.blob.size >= 35000 && !byId.has(cleanId(row.id))) {
        const t = row.track || { id: row.id, name: 'Canción descargada', artists: [{ name: 'Sin conexión' }] };
        byId.set(cleanId(row.id), t);
      }
    }

    // 3. localStorage metadata + CacheStorage verification
    const cachedIds = new Set();
    if ('caches' in window) {
      try {
        const cache = await caches.open(CACHE_NAME);
        const keys = await cache.keys();
        for (const req of keys) {
          const m = req.url.match(/\/musica-spotifree\/tracks\/([^/]+)\.mp3$/);
          if (m && m[1]) cachedIds.add(cleanId(m[1]));
        }
      } catch {}
    }

    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith(TRACK_META_PREFIX)) {
          try {
            const trk = JSON.parse(localStorage.getItem(key) || 'null');
            if (trk?.id) {
              const c = cleanId(trk.id);
              if (cachedIds.has(c) && !byId.has(c)) byId.set(c, trk);
            }
          } catch {}
        }
      }
    } catch {}

    for (const c of cachedIds) {
      if (!byId.has(c)) {
        byId.set(c, { id: c, name: 'Canción (' + c + ')', artists: [{ name: 'Descargada' }] });
      }
    }

    if (offlinePlaylists.length === 0) {
      try {
        const plList = JSON.parse(localStorage.getItem('spotifree_downloaded_playlists_list') || '[]');
        for (const pid of plList) {
          const raw = localStorage.getItem('spotifree_offline_meta_' + pid);
          if (raw) offlinePlaylists.push(JSON.parse(raw));
        }
      } catch {}
    }

    allTracks = Array.from(byId.values());
    renderChips();
    renderList();
  }

  function getFilteredTracks() {
    if (activeFilter === 'all') return allTracks;
    if (activeFilter === 'device') return allTracks.filter((t) => t._isDevice);
    const pl = offlinePlaylists.find((p) => p.id === activeFilter);
    if (!pl?.tracks?.items) return allTracks;
    const plSet = new Set(pl.tracks.items.map((x) => cleanId(x.id)));
    return allTracks.filter((t) => plSet.has(cleanId(t.id)));
  }

  function renderChips() {
    const chips = document.getElementById('filter-chips');
    const items = [{ id: 'all', label: 'Todo (' + allTracks.length + ')' }];
    const hasDevice = allTracks.some((t) => t._isDevice);
    if (hasDevice) items.push({ id: 'device', label: 'Del teléfono' });
    for (const pl of offlinePlaylists) {
      items.push({ id: pl.id, label: pl.name || 'Playlist' });
    }
    chips.innerHTML = '';
    for (const item of items) {
      const b = document.createElement('button');
      b.className = 'chip' + (activeFilter === item.id ? ' active' : '');
      b.textContent = item.label;
      b.onclick = () => {
        activeFilter = item.id;
        renderChips();
        renderList();
      };
      chips.appendChild(b);
    }
  }

  function renderList() {
    const list = getFilteredTracks();
    const container = document.getElementById('track-list');
    const empty = document.getElementById('empty-state');
    const badge = document.getElementById('track-count');
    const actionsRow = document.getElementById('actions-row');

    badge.innerText = list.length + (list.length === 1 ? ' canción' : ' canciones');
    actionsRow.style.display = list.length > 0 ? 'flex' : 'none';

    if (list.length === 0) {
      container.innerHTML = '';
      container.appendChild(empty);
      empty.style.display = 'flex';
      return;
    }

    container.innerHTML = '';
    list.forEach((t) => {
      const div = document.createElement('div');
      div.className = 'track-item' + (currentTrack && cleanId(currentTrack.id) === cleanId(t.id) ? ' playing' : '');
      const cover = t.album?.images?.[0]?.url || 'icon-192.png';
      const artist = t.artists?.[0]?.name || 'Artista';

      div.innerHTML = `
        <img class="track-cover" src="${cover}" onerror="this.src='icon-192.png'" />
        <div class="track-info">
          <div class="track-title">${(t.name || '').replace(/</g, '&lt;')}</div>
          <div class="track-artist">${(artist || '').replace(/</g, '&lt;')}</div>
        </div>
      `;
      div.onclick = () => playTrack(t);
      container.appendChild(div);
    });
  }

  function playAll() {
    const list = getFilteredTracks();
    if (list.length > 0) playTrack(list[0]);
  }

  function playNext() {
    const list = getFilteredTracks();
    if (!list.length) return;
    const idx = currentTrack ? list.findIndex((t) => cleanId(t.id) === cleanId(currentTrack.id)) : -1;
    const next = list[(idx + 1) % list.length];
    if (next) playTrack(next);
  }

  function playPrev() {
    const list = getFilteredTracks();
    if (!list.length) return;
    const idx = currentTrack ? list.findIndex((t) => cleanId(t.id) === cleanId(currentTrack.id)) : 0;
    const prev = list[(idx - 1 + list.length) % list.length];
    if (prev) playTrack(prev);
  }

  async function playTrack(track) {
    currentTrack = track;
    const cId = cleanId(track.id);
    let playUrl = track._offlineUrl || null;

    if (!playUrl && window.Capacitor?.Plugins?.SpotifreeLocalMusic?.getOfflineTrackPath) {
      try {
        const res = await window.Capacitor.Plugins.SpotifreeLocalMusic.getOfflineTrackPath({ id: cId });
        if (res?.exists && res.path) {
          playUrl = window.Capacitor.convertFileSrc('file://' + res.path);
        }
      } catch {}
    }

    if (!playUrl && 'caches' in window) {
      try {
        const cache = await caches.open(CACHE_NAME);
        const res = (await cache.match('/musica-spotifree/tracks/' + cId + '.mp3')) ||
                    (await cache.match('/musica-spotifree/tracks/' + track.id + '.mp3'));
        if (res) {
          const blob = await res.blob();
          if (blob && blob.size >= 35000) {
            if (activeBlobUrl) URL.revokeObjectURL(activeBlobUrl);
            activeBlobUrl = URL.createObjectURL(blob);
            playUrl = activeBlobUrl;
          }
        }
      } catch {}
    }

    if (!playUrl) {
      const idbBlob = await idbGetTrackBlob(cId);
      if (idbBlob) {
        if (activeBlobUrl) URL.revokeObjectURL(activeBlobUrl);
        activeBlobUrl = URL.createObjectURL(idbBlob);
        playUrl = activeBlobUrl;
      }
    }

    if (!playUrl) {
      alert('No se encontró el archivo descargado para "' + track.name + '".');
      return;
    }

    audio.src = playUrl;
    audio.play().catch(() => {});

    document.getElementById('player-bar').classList.add('active');
    document.getElementById('p-title').innerText = track.name || 'Canción';
    document.getElementById('p-artist').innerText = track.artists?.[0]?.name || 'Artista';
    document.getElementById('p-cover').src = track.album?.images?.[0]?.url || 'icon-192.png';

    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.name,
          artist: track.artists?.[0]?.name || 'Artista',
          album: track.album?.name || 'Spotifree sin conexión',
        });
        navigator.mediaSession.setActionHandler('nexttrack', playNext);
        navigator.mediaSession.setActionHandler('previoustrack', playPrev);
      } catch {}
    }

    renderList();
  }

  function togglePlay() {
    if (audio.paused) audio.play().catch(() => {});
    else audio.pause();
  }

  audio.onplay = () => {
    document.getElementById('p-play-icon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  };

  audio.onpause = () => {
    document.getElementById('p-play-icon').innerHTML = '<path d="M8 5v14l11-7z"/>';
  };

  audio.onended = () => {
    playNext();
  };

  audio.ontimeupdate = () => {
    if (!audio.duration || !isFinite(audio.duration)) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('p-progress').value = pct;
    document.getElementById('p-cur-time').innerText = formatTime(audio.currentTime);
    document.getElementById('p-dur-time').innerText = formatTime(audio.duration);
  };

  function seekTrack(pct) {
    if (audio.duration && isFinite(audio.duration)) {
      audio.currentTime = (pct / 100) * audio.duration;
    }
  }

  loadOfflineMusic();
</script>
</body>
</html>
